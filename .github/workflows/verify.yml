name: Verify ADAM

on: [pull_request, push]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: adam_user
          POSTGRES_PASSWORD: adam_ci_only
          POSTGRES_DB: adam_enhanced
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adam_user -d adam_enhanced"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://adam_user:adam_ci_only@localhost:5432/adam_enhanced
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest tests -q
      - name: Verify PostgreSQL schema and pgvector
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy import text
          from app.database import init_db, engine

          async def verify():
              try:
                  await init_db()
                  async with engine.connect() as conn:
                      assert await conn.scalar(text("SELECT to_regclass('public.datasets') IS NOT NULL"))
                      assert await conn.scalar(text("SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector')"))
              finally:
                  await engine.dispose()

          asyncio.run(verify())
          PY
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: node scripts/test_sidebar_order.cjs
      - run: node scripts/test_trajectory_frontend.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium || true
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Exercise production bundle with real API
        run: |
          (cd backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) > /tmp/adam-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then echo "Backend ready"; break; fi
            sleep 1
          done
          (cd frontend && VITE_API_URL=http://127.0.0.1:8000 npm run preview) > /tmp/adam-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/ml/samples?limit=1 >/dev/null 2>&1; then echo "Frontend ready"; break; fi
            sleep 1
          done
          node frontend/scripts/test_website.mjs
          node frontend/scripts/smoke_test.mjs
  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science texlive-publishers texlive-fonts-extra texlive-plain-generic
      - name: Compile ACM manuscript
        working-directory: manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: acm-manuscript
          path: manuscript/main.pdf
