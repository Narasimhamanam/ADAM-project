# ============================================================================
# ADAM-1 Enhanced — Render Infrastructure as Code Blueprint
# ============================================================================
# Deploys the complete ADAM-1 Enhanced platform:
#   1. Managed PostgreSQL 16 Database with pgvector extension support
#   2. FastAPI Async Backend Web Service (Python 3.11)
#   3. React + Vite Frontend Static Site with client-side SPA routing
# ============================================================================

services:
  # ─────────────────────────────────────────────────────────────
  # 1. FastAPI Async Backend Web Service
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: adam-enhanced-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "ADAM-1 Enhanced"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_VERSION
        value: "1.0.0"
      - key: LOG_LEVEL
        value: INFO
      - key: PGVECTOR_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: adam-enhanced-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      # User adds their Groq API key securely in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "groq/compound-mini"

  # ─────────────────────────────────────────────────────────────
  # 2. React + Vite Frontend Static Site
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: adam-enhanced-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      # Client-side SPA routing rewrite rule
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: adam-enhanced-backend
          property: host
      - key: VITE_APP_NAME
        value: "ADAM-1 Enhanced"

databases:
  # ─────────────────────────────────────────────────────────────
  # 3. Managed PostgreSQL 16 Database
  # ─────────────────────────────────────────────────────────────
  - name: adam-enhanced-db
    databaseName: adam_enhanced
    user: adam_user
    plan: free
    region: oregon
    postgresMajorVersion: 16
