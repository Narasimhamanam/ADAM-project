# ============================================================================
# ADAM-1 Enhanced — Render Infrastructure as Code Blueprint
# ============================================================================

services:
  # ─────────────────────────────────────────────────────────────
  # 1. FastAPI Backend
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: adam-enhanced-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt --prefer-binary
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: APP_NAME
        value: "ADAM-1 Enhanced"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_VERSION
        value: "1.0.0"
      - key: LOG_LEVEL
        value: INFO
      - key: PGVECTOR_ENABLED
        value: "true"

      - key: DATABASE_URL
        fromDatabase:
          name: adam-enhanced-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: CORS_ORIGINS
        value: "*"

      # Set securely in Render Dashboard
      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: "groq/compound-mini"


  # ─────────────────────────────────────────────────────────────
  # 2. React + Vite Frontend Static Site
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: adam-enhanced-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # IMPORTANT:
      # Replace this with your actual backend public URL if Render
      # doesn't allow the URL to be dynamically referenced.
      - key: VITE_API_URL
        sync: false

      - key: VITE_APP_NAME
        value: "ADAM-1 Enhanced"


databases:
  # ─────────────────────────────────────────────────────────────
  # 3. PostgreSQL Database
  # ─────────────────────────────────────────────────────────────
  - name: adam-enhanced-db
    databaseName: adam_enhanced
    user: adam_user
    plan: free
    region: oregon
    postgresMajorVersion: 16